services:
  docker-app-manager:
    build: .
    image: docker-app-manager:container-manager
    container_name: docker-app-manager
    restart: unless-stopped
    ports:
      - "${BUILDER_BIND_IP:-0.0.0.0}:${BUILDER_PORT:-5055}:8080"
    environment:
      BASE_PATH: /volume1/docker
      BACKUP_ROOT: /volume1/docker/_BACKUPS
      BUILDER_CONFIG_PATH: /config/builder-auth.json
      BUILDER_SESSION_COOKIE_SECURE: ${BUILDER_SESSION_COOKIE_SECURE:-false}
      TZ: ${TZ:-Europe/Brussels}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /volume1/docker:/volume1/docker
      - ./config:/config
