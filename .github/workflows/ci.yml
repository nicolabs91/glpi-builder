name: Docker App Manager CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUILDER_AUTH_STATE_PATH: /tmp/docker-app-manager-ci/auth-state/totp-replay-state
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run regression suite
        run: python -m unittest discover -s tests -q

      - name: Validate generated application Compose profiles
        run: python -m unittest tests.test_app_profiles.ApplicationProfileTests.test_generated_compose_profiles_validate_with_docker_compose -v

      - name: Compile Python sources
        run: python -m py_compile app.py app_ui.py app_profiles.py auth_security.py scripts/provision_admin.py

      - name: Build release container
        run: docker build --tag docker-app-manager:${GITHUB_SHA} .

      - name: Verify application version inside image
        run: docker run --rm docker-app-manager:${GITHUB_SHA} python -c "import app; assert app.APP_VERSION == '0.4.0'"
