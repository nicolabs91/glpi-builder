services:
  glpi-project-builder-full-restore:
    build: .
    image: glpi-project-builder-full-restore-v10-4-sso-yaml-locked:latest
    container_name: glpi-project-builder-full-restore
    restart: "no"
    ports:
      - "5055:8080"
    environment:
      BASE_PATH: /volume1/docker
      BACKUP_ROOT: /volume1/docker/_BACKUPS
      TZ: Europe/Amsterdam
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /volume1/docker:/volume1/docker
