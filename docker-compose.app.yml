services:
  docker-app-manager:
    build: .
    image: ${DOCKER_APP_MANAGER_IMAGE:-docker-app-manager:latest}
    container_name: docker-app-manager
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${BUILDER_BIND_IP:-127.0.0.1}:${BUILDER_PORT:-5055}:8080"
    environment:
      BASE_PATH: /volume1/docker
      BACKUP_ROOT: /volume1/docker/_BACKUPS
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /volume1/docker:/volume1/docker
