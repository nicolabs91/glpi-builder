services:
  glpi-builder:
    build: .
    image: ${GLPI_BUILDER_IMAGE:-glpi-builder:latest}
    container_name: glpi-builder
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${BUILDER_BIND_IP:-127.0.0.1}:${BUILDER_PORT:-5055}:8080"
    environment:
      BASE_PATH: /volume1/docker
      BACKUP_ROOT: /volume1/docker/_BACKUPS
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /volume1/docker:/volume1/docker
